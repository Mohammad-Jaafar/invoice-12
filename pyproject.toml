[project]
name = "invoice-extractor"
version = "0.1.0"
description = "Arabic/English invoice image -> validated JSON, with an arithmetic validator and an evaluation harness"
readme = "README.md"
authors = [
    { name = "Mohammad-Jaafar", email = "mhdjaafar24@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.154.0",
    "google-genai>=2.29.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "playwright>=1.63.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "opencv-python-headless>=5.0.0.93",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
]
