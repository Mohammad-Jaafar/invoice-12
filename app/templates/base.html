<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice Review</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; background: #f6f7f9; color: #1f2328; }
  nav { display: flex; gap: 20px; align-items: center; padding: 12px 24px; background: #1f2328; }
  nav strong { color: #fff; margin-right: 12px; }
  nav a { color: #c9d1d9; text-decoration: none; }
  nav a:hover { color: #fff; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #d0d7de; border-radius: 6px; overflow: hidden; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eaeef2; }
  th { background: #f6f8fa; font-size: 13px; color: #57606a; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  a { color: #0969da; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .bad { background: #ffebe9; color: #cf222e; }
  .good { background: #dafbe1; color: #1a7f37; }
  .empty { padding: 32px; text-align: center; color: #57606a; background: #fff; border: 1px solid #d0d7de; border-radius: 6px; }
</style>
</head>
<body>
<nav>
  <strong>Invoice Review</strong>
  <a href="/review">Pending</a>
  <a href="/review?show=all">All</a>
  <a href="/review/stats">Stats</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
