services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: invoices
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d invoices"]
      interval: 5s
      timeout: 3s
      retries: 10
 
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/invoices
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
 
volumes:
  pgdata:
